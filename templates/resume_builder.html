<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder (Flask)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f0f2f5; }
        .container { display: flex; width: 100%; }
        .editor-panel, .preview-panel { flex: 1; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; }
        .editor-panel { width: 50%; background-color: #fff; border-right: 1px solid #ccc; }
        .editor-group { flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; }
        .editor-group label { margin-bottom: 5px; font-weight: bold; }
        .editor-group textarea { flex: 1; width: 100%; border: 1px solid #ccc; padding: 10px; font-family: monospace; font-size: 14px; resize: none; overflow: auto; }
        .preview-panel { width: 50%; background-color: #fff; }
        .preview-panel iframe { flex: 1; width: 100%; height: 100%; border: 1px solid #ccc; }
        .button-group { text-align: center; padding: 10px 0; }
        .button-group button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-panel">
            <div class="editor-group">
                <label for="json-editor">JSON Data</label>
                <textarea id="json-editor">{{ default_json }}</textarea>
            </div>
            <div class="editor-group">
                <label for="html-editor">HTML Template</label>
                <textarea id="html-editor">{{ default_html }}</textarea>
            </div>
            <div class="button-group">
                <button id="update-button">Update Resume</button>
            </div>
        </div>
        <div class="preview-panel">
            <label>Resume Preview</label>
            <iframe id="resume-preview"></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const jsonEditor = document.getElementById('json-editor');
            const htmlEditor = document.getElementById('html-editor');
            const resumePreview = document.getElementById('resume-preview');
            const updateButton = document.getElementById('update-button');
    
            // Function to send data to the server and update the preview/download
            function updateResume() {
                const jsonData = jsonEditor.value;
                const htmlTemplate = htmlEditor.value;
                
                // Set up fetch call to handle binary response
                fetch('/build-resume', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ jsonData, htmlTemplate }),
                })
                .then(response => {
                    // Check if the response is a PDF
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/pdf')) {
                        // This is the PDF response. Return it as a blob.
                        return response.blob();
                    } else {
                        // This is likely an error message (JSON). Parse and throw.
                        return response.json().then(errorData => {
                            throw new Error(errorData.error || 'Unknown server error');
                        });
                    }
                })
                .then(blob => {
                    // Create a local URL for the PDF blob
                    const pdfUrl = URL.createObjectURL(blob);
                    
                    // Display the PDF in the iframe
                    resumePreview.src = pdfUrl;
    
                    // Create a temporary link to trigger a download
                    const downloadLink = document.createElement('a');
                    downloadLink.href = pdfUrl;
                    downloadLink.download = 'resume.pdf';
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                    
                })
                .catch(error => {
                    console.error("Fetch error:", error);
                    resumePreview.contentDocument.open();
                    resumePreview.contentDocument.write(`<p style="color: red;">Error: ${error.message}</p>`);
                    resumePreview.contentDocument.close();
                });
            }
    
            // Initial render on page load
            // Note: The first render will trigger an initial download.
            // You might want to remove this if that's not the desired behavior.
            updateResume();
    
            // Add event listener for the update button
            updateButton.addEventListener('click', updateResume);
        });
    </script>
    
</body>
</html>
